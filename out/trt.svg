<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="840.0" height="392.0" viewBox="0 0 840.0 392.0"><style>
				text { font-family: Helvetica, Arial, "PingFang SC", "Noto Sans SC", sans-serif; }
			</style><rect width="100%" height="100%" fill="#FDFEFE"/><text x="20" y="28" font-size="16" font-weight="bold" fill="#1C2833">Transition Tree</text><line x1="280.0" y1="87.0" x2="290" y2="87.0" stroke="#95A5A6" stroke-width="1.6" stroke-dasharray="4 3"/><polygon points="290,87.0 282.0,90.2 282.0,83.8" fill="#95A5A6"/><line x1="534.0" y1="87.0" x2="550.0" y2="87.0" stroke="#2C3E50" stroke-width="1.6"/><polygon points="550.0,87.0 542.0,90.2 542.0,83.8" fill="#2C3E50"/><line x1="280.0" y1="200.0" x2="290" y2="200.0" stroke="#95A5A6" stroke-width="1.6" stroke-dasharray="4 3"/><polygon points="290,200.0 282.0,203.2 282.0,196.8" fill="#95A5A6"/><line x1="534.0" y1="200.0" x2="550.0" y2="200.0" stroke="#2C3E50" stroke-width="1.6"/><polygon points="550.0,200.0 542.0,203.2 542.0,196.8" fill="#2C3E50"/><line x1="676.020616140355" y1="117.405591047233" x2="169.948459649113" y2="168.986022381917" stroke="#85929E" stroke-width="1.6" stroke-dasharray="3 3"/><polygon points="169.948459649113,168.986022381917 177.582754530617,164.991333199735 178.23170020619,171.358347375167" fill="#85929E"/><line x1="280.0" y1="313.0" x2="290" y2="313.0" stroke="#95A5A6" stroke-width="1.6" stroke-dasharray="4 3"/><polygon points="290,313.0 282.0,316.2 282.0,309.8" fill="#95A5A6"/><line x1="534.0" y1="313.0" x2="550.0" y2="313.0" stroke="#2C3E50" stroke-width="1.6"/><polygon points="550.0,313.0 542.0,316.2 542.0,309.8" fill="#2C3E50"/><line x1="676.028132358786" y1="230.473568834145" x2="169.929669103036" y2="290.816077914638" stroke="#85929E" stroke-width="1.6" stroke-dasharray="3 3"/><polygon points="169.929669103036,290.816077914638 177.494549318149,286.691446133377 178.252259452781,293.04643435932" fill="#85929E"/><rect x="290" y="48.0" width="240.0" height="78" rx="6" ry="6" fill="#EBF5FB" stroke="#2874A6" stroke-width="1.5"/><text x="410.0" y="73.0" text-anchor="middle" font-size="13" font-family="Helvetica,Arial,'PingFang SC','Noto Sans SC',sans-serif" fill="#1C2833">拉出过去三个月的记录，把同时开工</text><text x="410.0" y="91.0" text-anchor="middle" font-size="13" font-family="Helvetica,Arial,'PingFang SC','Noto Sans SC',sans-serif" fill="#1C2833">的活儿数和延期率、返工工时摆到一</text><text x="410.0" y="109.0" text-anchor="middle" font-size="13" font-family="Helvetica,Arial,'PingFang SC','Noto Sans SC',sans-serif" fill="#1C2833">页纸上</text><rect x="560" y="57.0" width="240.0" height="60" rx="6" ry="6" fill="#E8F6F3" stroke="#148F77" stroke-width="1.5"/><text x="680.0" y="82.0" text-anchor="middle" font-size="13" font-family="Helvetica,Arial,'PingFang SC','Noto Sans SC',sans-serif" fill="#1C2833">老板第一次亲眼看见——开工越多，</text><text x="680.0" y="100.0" text-anchor="middle" font-size="13" font-family="Helvetica,Arial,'PingFang SC','Noto Sans SC',sans-serif" fill="#1C2833">反而交付越慢、返工越多</text><rect x="40" y="57.0" width="240.0" height="60" rx="6" ry="6" fill="#F8F9F9" stroke="#7F8C8D" stroke-width="1.5"/><text x="160.0" y="82.0" text-anchor="middle" font-size="13" font-family="Helvetica,Arial,'PingFang SC','Noto Sans SC',sans-serif" fill="#1C2833">老板凭直觉认定马上开工等于让客户</text><text x="160.0" y="100.0" text-anchor="middle" font-size="13" font-family="Helvetica,Arial,'PingFang SC','Noto Sans SC',sans-serif" fill="#1C2833">满意，从没看过反面的数据</text><rect x="290" y="170.0" width="240.0" height="60" rx="6" ry="6" fill="#EBF5FB" stroke="#2874A6" stroke-width="1.5"/><text x="410.0" y="195.0" text-anchor="middle" font-size="13" font-family="Helvetica,Arial,'PingFang SC','Noto Sans SC',sans-serif" fill="#1C2833">当场给他画一朵冲突图，把他自己的</text><text x="410.0" y="213.0" text-anchor="middle" font-size="13" font-family="Helvetica,Arial,'PingFang SC','Noto Sans SC',sans-serif" fill="#1C2833">两难摆出来</text><rect x="560" y="170.0" width="240.0" height="60" rx="6" ry="6" fill="#E8F6F3" stroke="#148F77" stroke-width="1.5"/><text x="680.0" y="195.0" text-anchor="middle" font-size="13" font-family="Helvetica,Arial,'PingFang SC','Noto Sans SC',sans-serif" fill="#1C2833">老板意识到，问题不是要不要满足客</text><text x="680.0" y="213.0" text-anchor="middle" font-size="13" font-family="Helvetica,Arial,'PingFang SC','Noto Sans SC',sans-serif" fill="#1C2833">户，而是怎么满足才不塌方</text><rect x="40" y="170.0" width="240.0" height="60" rx="6" ry="6" fill="#F8F9F9" stroke="#7F8C8D" stroke-width="1.5"/><text x="160.0" y="195.0" text-anchor="middle" font-size="13" font-family="Helvetica,Arial,'PingFang SC','Noto Sans SC',sans-serif" fill="#1C2833">老板动摇了，但还没有替代方案，怕</text><text x="160.0" y="213.0" text-anchor="middle" font-size="13" font-family="Helvetica,Arial,'PingFang SC','Noto Sans SC',sans-serif" fill="#1C2833">排队会得罪客户</text><rect x="290" y="274.0" width="240.0" height="78" rx="6" ry="6" fill="#EBF5FB" stroke="#2874A6" stroke-width="1.5"/><text x="410.0" y="299.0" text-anchor="middle" font-size="13" font-family="Helvetica,Arial,'PingFang SC','Noto Sans SC',sans-serif" fill="#1C2833">提议一个两周的小试点——只挑一个</text><text x="410.0" y="317.0" text-anchor="middle" font-size="13" font-family="Helvetica,Arial,'PingFang SC','Noto Sans SC',sans-serif" fill="#1C2833">产品线、一个客户，试行排队和限制</text><text x="410.0" y="335.0" text-anchor="middle" font-size="13" font-family="Helvetica,Arial,'PingFang SC','Noto Sans SC',sans-serif" fill="#1C2833">开工</text><rect x="560" y="292.0" width="214.0" height="42" rx="6" ry="6" fill="#E8F6F3" stroke="#148F77" stroke-width="1.5"/><text x="667.0" y="317.0" text-anchor="middle" font-size="13" font-family="Helvetica,Arial,'PingFang SC','Noto Sans SC',sans-serif" fill="#1C2833">老板同意了这个低风险的小试点</text><rect x="40" y="292.0" width="240.0" height="42" rx="6" ry="6" fill="#F8F9F9" stroke="#7F8C8D" stroke-width="1.5"/><text x="160.0" y="317.0" text-anchor="middle" font-size="13" font-family="Helvetica,Arial,'PingFang SC','Noto Sans SC',sans-serif" fill="#1C2833">老板认了道理，但不敢全公司一刀切</text></svg>